<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrukKilat - Web Kasir & Generator Struk</title>
  <link rel="stylesheet" href="style.css">
  <!-- Pustaka CDN html2canvas untuk fitur unduh gambar -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div class="container">
    <!-- SEKSI INPUT FORM -->
    <div class="form-section">
      <h2>Input Data Transaksi</h2>
      
      <!-- Informasi Toko & Kasir -->
      <div class="form-group">
        <label for="shop-name">Nama Kedai / Toko</label>
        <input type="text" id="shop-name" value="Kedai Kopi Pelajar">
      </div>

      <div class="form-group">
        <label for="shop-phone">Nomor Telepon</label>
        <input type="text" id="shop-phone" value="0812-3456-7890">
      </div>

      <div class="form-group">
        <label for="cashier-name">Nama Kasir</label>
        <input type="text" id="cashier-name" value="Budi">
      </div>

      <hr class="form-divider">

      <!-- Input Barang -->
      <h3>Tambah Item Barang</h3>
      <div class="form-group">
        <label for="item-name">Nama Barang</label>
        <input type="text" id="item-name" placeholder="Contoh: Es Teh Manis">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="item-qty">Jumlah (Qty)</label>
          <input type="number" id="item-qty" min="1" value="1">
        </div>
        <div class="form-group">
          <label for="item-price">Harga Satuan (Rp)</label>
          <input type="number" id="item-price" min="0" placeholder="5000">
        </div>
      </div>

      <button id="add-item-btn" class="btn btn-secondary">Tambah Barang</button>

      <hr class="form-divider">

      <!-- Pembayaran -->
      <div class="form-group">
        <label for="pay-amount">Uang Dibayar (Rp)</label>
        <input type="number" id="pay-amount" min="0" placeholder="50000">
      </div>

      <div class="button-group">
        <button id="generate-btn" class="btn btn-primary">Update Struk</button>
        <button id="download-btn" class="btn btn-success">Unduh Struk (PNG)</button>
      </div>
    </div>

    <!-- SEKSI PRATINJAU STRUK -->
    <div class="preview-section">
      <div id="receipt-preview" class="receipt-box">
        
        <!-- Header: Rata Tengah -->
        <div class="receipt-header">
          <h2 id="receipt-shop-name">Kedai Kopi Pelajar</h2>
          <p id="receipt-shop-phone">0812-3456-7890</p>
        </div>

        <!-- Sekat Garis Putus-putus -->
        <div class="divider-dashed"></div>

        <!-- Info Transaksi: Rata Kiri -->
        <div class="receipt-meta">
          <p id="receipt-datetime">Tgl/Waktu: -</p>
          <p id="receipt-cashier">Kasir: Budi</p>
        </div>

        <!-- Sekat Garis Putus-putus -->
        <div class="divider-dashed"></div>

        <!-- Daftar Item Belanja -->
        <div class="receipt-items">
          <table id="items-table">
            <thead>
              <tr>
                <th class="col-item">Item</th>
                <th class="col-qty">Qty</th>
                <th class="col-price">Harga</th>
                <th class="col-total">Total</th>
              </tr>
            </thead>
            <tbody id="items-list">
              <!-- Item barang dimasukkan via Javascript -->
            </tbody>
          </table>
        </div>

        <!-- Sekat Garis Putus-putus -->
        <div class="divider-dashed"></div>

        <!-- Total & Pembayaran -->
        <div class="receipt-summary">
          <div class="summary-row">
            <span>Total Belanja:</span>
            <span id="receipt-grand-total">Rp 0</span>
          </div>
          <div class="summary-row">
            <span>Tunai:</span>
            <span id="receipt-pay">Rp 0</span>
          </div>
          <div class="summary-row">
            <span>Kembali:</span>
            <span id="receipt-change">Rp 0</span>
          </div>
        </div>

        <!-- Sekat Garis Putus-putus -->
        <div class="divider-dashed"></div>

        <!-- Footer Struk -->
        <div class="receipt-footer">
          <p>Terima Kasih Atas Kunjungan Anda!</p>
          <p>--- Selamat Berbelanja ---</p>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
